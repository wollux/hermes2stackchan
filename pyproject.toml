[project]
name = "hermes2stackchan"
version = "0.1.0"
description = "Hermes-to-StackChan MQTT bridge."
requires-python = ">=3.11"
dependencies = [
  "edge-tts>=7.0.0",
  "paho-mqtt>=2.1.0"
]

[project.scripts]
h2s-bridge = "bridge.hermes2stackchan_bridge:main"

[tool.setuptools]
packages = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
